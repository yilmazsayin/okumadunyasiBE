name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - run: ruff check app.py document_parser.py scripts tests
      - run: ruff format --check app.py document_parser.py scripts tests
      - run: python -m pip check
